# Shared security headers.
# nginx does NOT merge add_header directives across nesting levels: any
# location{} block that defines its own add_header discards all add_header
# set at the server{} level. So this snippet must be included in every
# location block, not just declared once at server level.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Packeta/Zásilkovna pickup-point widget: per their docs, the widget loads
# library.js from widget.packeta.com and renders its entire UI (map, point
# list) inside an isolated iframe from the same domain, communicating with
# our page only via postMessage (not fetch/XHR). So script-src + frame-src
# for that one domain is sufficient — no connect-src exception needed.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://widget.packeta.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; frame-src https://widget.packeta.com; connect-src 'self'; base-uri 'self'; form-action 'self'" always;

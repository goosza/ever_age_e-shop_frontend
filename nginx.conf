server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_comp_level 6;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Packeta/Zásilkovna pickup-point widget: per their docs, the widget loads
    # library.js from widget.packeta.com and renders its entire UI (map, point
    # list) inside an isolated iframe from the same domain, communicating with
    # our page only via postMessage (not fetch/XHR). So script-src + frame-src
    # for that one domain is sufficient — no connect-src exception needed.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://widget.packeta.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; frame-src https://widget.packeta.com; connect-src 'self'; base-uri 'self'; form-action 'self'" always;

    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://${SERVER_IP}:${BACKEND_PORT}/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router - SPA fallback
    location / {
        try_files $uri $uri/ /index.html;

        # Cache HTML files for 1 hour
        add_header Cache-Control "public, max-age=3600";
    }

    # Cache static assets (JS, CSS, images)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Cache videos
    location ~* \.(mp4|webm)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # Don't cache service worker
    location = /service-worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # Disable logging for favicon and robots.txt
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    location = /robots.txt {
        log_not_found off;
        access_log off;
    }

    # Health check endpoint
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "healthy\n";
    }
}
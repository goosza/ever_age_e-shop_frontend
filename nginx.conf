server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_comp_level 6;

    # Security headers
    # NOTE: nginx does not merge add_header across nesting levels — any
    # location{} below that sets its own add_header must also include this
    # snippet, or it will silently drop these headers. See security-headers.conf.
    include /etc/nginx/conf.d/security-headers.conf;

    # Proxy API requests to backend (docker-network service name, not host IP —
    # the backend container no longer publishes a port directly on the host)
    location /api/ {
        include /etc/nginx/conf.d/security-headers.conf;
        proxy_pass http://everage-service:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router - SPA fallback
    location / {
        include /etc/nginx/conf.d/security-headers.conf;
        try_files $uri $uri/ /index.html;

        # Cache HTML files for 1 hour
        add_header Cache-Control "public, max-age=3600";
    }

    # Cache static assets (JS, CSS, images)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp)$ {
        include /etc/nginx/conf.d/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Cache videos
    location ~* \.(mp4|webm)$ {
        include /etc/nginx/conf.d/security-headers.conf;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Don't cache service worker
    location = /service-worker.js {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # Disable logging for favicon and robots.txt
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    location = /robots.txt {
        log_not_found off;
        access_log off;
    }

    # Health check endpoint
    location = /health {
        include /etc/nginx/conf.d/security-headers.conf;
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }
}